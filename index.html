<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Menu</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header shown only when a valid place is loaded -->
  <header id="place-header" class="hidden">
    <img id="place-logo" class="logo" alt="" />
    <h1 id="place-name">Restaurant</h1>
  </header>

  <!-- No ?place= param -->
  <main id="placeholder" class="state">
    <h1>QR-Menu</h1>
    <p>Scan the QR code on your table to view the menu.</p>
  </main>

  <!-- ?place= param not found in config -->
  <main id="not-found" class="state hidden">
    <h1>Menu not found</h1>
    <p>Please check the link or QR code.</p>
  </main>

  <!-- PDF viewer -->
  <main id="pdf-view" class="hidden">
    <iframe id="pdf-frame" title="PDF menu"></iframe>
    <p id="pdf-fallback" class="state hidden">Your browser can't preview the PDF here — use the button below.</p>
  </main>

  <a id="download-btn" class="download-btn hidden" href="#" target="_blank" rel="noopener">Open / Download PDF</a>

<script>
  /* ---------------------------------------------------------
     CONFIG — add a new place here, one line each.
     key: URL-safe id used as ?place=key
     name: shown in header
     logo: path to logo image
     pdf: path to PDF in /menus/
  --------------------------------------------------------- */
  const menu = {
    "kafe-luna": { name: "Cafe Luna", logo: "assets/logo-placeholder.svg", pdf: "menus/kafe-luna.pdf" },
    "mario-pizza": { name: "Mario Pizza", logo: "assets/logo-placeholder.svg", pdf: "menus/mario-pizza.pdf" }
    // "new-place": { name: "New Place", logo: "assets/logo-placeholder.svg", pdf: "menus/new-place.pdf" },
  };

  const key = new URLSearchParams(location.search).get("place");
  const $ = id => document.getElementById(id);
  const show = el => el.classList.remove("hidden");

  if (!key) {
    show($("placeholder"));
  } else {
    const place = menu[key];
    if (!place) {
      show($("not-found"));
    } else {
      document.title = place.name;
      $("place-name").textContent = place.name;
      $("place-logo").src = place.logo;
      $("place-logo").onerror = () => { $("place-logo").style.display = "none"; };
      show($("place-header"));

      $("pdf-frame").src = place.pdf;
      show($("pdf-view"));

      const btn = $("download-btn");
      btn.href = place.pdf;
      show(btn);

      let loaded = false;
      $("pdf-frame").addEventListener("load", () => { loaded = true; });
      setTimeout(() => { if (!loaded) show($("pdf-fallback")); }, 2500);
    }
  }
</script>
</body>
</html>
